<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 — Warm brutalist-lite</title>
  <style>
    :root {
      --bg: #EDEAE4; --surface: #F6F4EF; --ink: #201C18; --muted: #6B635B; --line: #201C18; --accent: #9E4321;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .mono { font-family: 'SF Mono', ui-monospace, 'Cascadia Code', monospace; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem clamp(1rem,4vw,2.5rem); border-bottom: 2px solid var(--ink); }
    header .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
    header .tag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }

    .hero { padding: clamp(2rem,8vw,6rem) clamp(1rem,4vw,2.5rem); border-bottom: 2px solid var(--ink); }
    .hero .label { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .hero h1 { font-weight: 800; font-size: clamp(3rem, 14vw, 11rem); line-height: .85; letter-spacing: -.04em; text-transform: uppercase; }
    .hero h1 span { color: var(--accent); }
    .hero .sub { max-width: 40ch; margin-top: 2rem; font-size: 1.05rem; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); }
    .cell { border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 1.75rem clamp(1rem,4vw,2.5rem); min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; }
    .cell:nth-child(3n) { border-right: none; }
    .cell .idx { font-size: .75rem; letter-spacing: .1em; }
    .cell h2 { font-weight: 800; font-size: 1.5rem; text-transform: uppercase; letter-spacing: -.01em; }
    .cell:hover { background: var(--accent); color: var(--surface); }
    .cell:hover .idx { color: var(--surface); }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .cell, .cell:nth-child(3n) { border-right: none; }
      header .tag { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">TSZUK</span>
    <span class="tag mono">PE / ZA — a brand that builds</span>
  </header>

  <section class="hero">
    <p class="label mono">Est. — branding studio</p>
    <h1>Brand<br>that <span>builds</span></h1>
    <p class="sub">No spectacle. Just identities that resonate — engineered for companies and personalities.</p>
  </section>

  <div class="grid">
    <div class="cell"><span class="idx mono">01 / IDENTITY</span><h2>Solar Valley</h2></div>
    <div class="cell"><span class="idx mono">02 / EXPERIENCE</span><h2>The One Room</h2></div>
    <div class="cell"><span class="idx mono">03 / COMMERCE</span><h2>Mendys Shop</h2></div>
  </div>
</body>
</html>
