<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mendys Online Shop — Coming Soon</title>
    <meta
      name="description"
      content="Mendys Online Shop is on its way. A warmer, easier place to shop."
    />
    <meta name="theme-color" content="#FDFDFC" />

    <!-- Space Grotesk (body + headings) · Instrument Serif (italic accent) · JetBrains Mono (metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* === Design tokens — mirrored from the tszuk "Refined Tech" system === */
      :root {
        --color-bg: #fdfdfc; /* clean warm near-white */
        --color-surface: #f7f5f1; /* warm off-white surface */
        --color-accent: #7c2b24; /* muted oxblood */
        --color-text: #171512; /* warm near-black */
        --color-divider: #e6e2db; /* warm hairline */
        --color-muted: #5c534b; /* warm muted text */

        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', Georgia, serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
        --font-weight-bold: 600;

        --font-size-mono: 0.875rem;
        --letter-spacing-mono: 0.02em;
        --font-weight-mono: 500;

        --edge: clamp(1.5rem, 5vw, 4rem);
        --rule-hair: 1px;
        --easing: cubic-bezier(0.25, 1, 0.5, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        font-family: var(--font-display);
        color: var(--color-text);
        background-color: var(--color-bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        /* Full-bleed centered hero */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--edge);
        gap: clamp(1.75rem, 5vh, 3rem);
      }

      /* === Brand === */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.85rem;
      }

      .brand__logo {
        width: clamp(48px, 6vw, 68px);
        height: clamp(48px, 6vw, 68px);
        border-radius: 10px;
        object-fit: cover;
        background-color: var(--color-surface);
      }

      .brand__name {
        font-family: var(--font-display);
        font-weight: var(--font-weight-bold);
        font-size: clamp(1.25rem, 2.5vw, 1.6rem);
        letter-spacing: -0.02em;
      }

      .brand__name span {
        color: var(--color-accent);
      }

      /* === Headline === */
      .headline {
        margin: 0;
        font-family: var(--font-display);
        font-weight: var(--font-weight-bold);
        font-size: clamp(3rem, 12vw, 9rem);
        line-height: 0.98;
        letter-spacing: -0.03em;
        max-width: 16ch;
      }

      .headline em {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--color-accent);
      }

      /* === Eyebrow (mono metadata label) === */
      .eyebrow {
        margin: 0;
        font-family: var(--font-mono);
        font-size: var(--font-size-mono);
        font-weight: var(--font-weight-mono);
        letter-spacing: var(--letter-spacing-mono);
        color: var(--color-accent);
      }

      /* === Footer credit === */
      .credit {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: var(--font-weight-mono);
        letter-spacing: var(--letter-spacing-mono);
        color: var(--color-muted);
      }

      .credit em {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        color: var(--color-accent);
      }
    </style>
  </head>

  <body>
    <span class="brand">
      <img
        class="brand__logo"
        src="./assets/mendys-logo.jpg"
        alt="Mendys Online Shop brand mark"
      />
      <span class="brand__name">Mendys<span>.</span></span>
    </span>

    <p class="eyebrow">// launching_soon</p>

    <h1 class="headline">Coming <em>soon</em>.</h1>

    <p class="credit">
      A brand experience by tszuk, <em>a brand that builds</em>.
    </p>
  </body>
</html>
